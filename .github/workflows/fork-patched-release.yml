# Builds getpaseo/paseo's latest stable release with the patches in .fork/patches for
# macOS arm64 and Windows x64, signs both with the fork certificate once a reviewer
# approves the fork-release environment, and publishes them as this fork's latest release
# so the patched desktop app updates from here. Design, security model and maintenance:
# .fork/README.md.
name: Fork patched release

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream stable release to build (vX.Y.Z). Empty: getpaseo/paseo's latest release."
        required: false
        default: ""
        type: string
      force:
        description: "Rebuild even if the fork already has this release; its assets are replaced in place."
        required: false
        default: false
        type: boolean
      publish:
        description: "Publish a release. Off: build and sign only, keep the installers as run artifacts, and also accept upstream prerelease tags."
        required: false
        default: true
        type: boolean

permissions: {}

# One run at a time. A run waiting for approval holds the group, so scheduled runs
# queue behind it (GitHub keeps only the newest pending run) instead of asking again.
concurrency:
  group: fork-patched-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: getpaseo/paseo

jobs:
  resolve:
    if: github.repository == 'Vincent-Leon/paseo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      latest: ${{ steps.resolve.outputs.latest }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          SKIP_TAGS: ${{ vars.FORK_SKIP_TAGS }}
        run: |
          set -euo pipefail
          # Scheduled runs have no inputs, so only an explicit false turns publishing off.
          publish=true
          [[ "$INPUT_PUBLISH" == "false" ]] && publish=false
          latest_tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)"
          tag="${INPUT_TAG:-$latest_tag}"
          # Only a stable release is ever published. A build-only run may also take an
          # upstream prerelease, whose installers stay run artifacts that never update anyone.
          if [[ "$publish" == "true" ]]; then
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
            expected_state="false,false"
          else
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
            expected_state="false,"
          fi
          if ! [[ "$tag" =~ $tag_pattern ]]; then
            echo "::error::'$tag' is not a release tag this run may build (publish=$publish)"
            exit 1
          fi
          # A manually chosen tag must also be a published upstream release.
          state="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/tags/$tag" --jq '[.draft, .prerelease] | map(tostring) | join(",")')"
          if [[ "$state" != "$expected_state"* ]]; then
            echo "::error::$tag is not a published release of $UPSTREAM_REPOSITORY this run may build (publish=$publish)"
            exit 1
          fi

          build=true
          if [[ "$publish" == "true" ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$INPUT_FORCE" != "true" ]]; then
              echo "The fork already has release $tag; nothing to do."
              build=false
            elif [[ -z "$INPUT_TAG" && " ${SKIP_TAGS:-} " == *" $tag "* ]]; then
              echo "$tag is listed in the FORK_SKIP_TAGS variable; skipping the scheduled build."
              build=false
            fi
          fi

          latest=false
          [[ "$tag" == "$latest_tag" ]] && latest=true
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "build=$build"
            echo "latest=$latest"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream $tag (latest upstream: $latest_tag), build=$build, publish=$publish"

  # Runs upstream code with no secrets and a read-only token.
  build:
    needs: resolve
    if: github.repository == 'Vincent-Leon/paseo' && needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.prepare.outputs.tree }}
      log: ${{ steps.prepare.outputs.log }}
      stage: ${{ steps.failure.outputs.stage }}
    steps:
      - name: Check out fork tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          persist-credentials: false

      # Full history (without blobs until needed) lets `git am -3` find the base
      # blobs a patch was written against, so it can merge instead of failing.
      - name: Check out upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getpaseo/paseo
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          path: upstream
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Apply fork patches
        id: prepare
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -uo pipefail
          bash fork/.fork/prepare-source.sh upstream 2>&1 | tee "$RUNNER_TEMP/prepare.log"
          status="${PIPESTATUS[0]}"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "log<<$delimiter"
            cat "$RUNNER_TEMP/prepare.log"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::error::The fork patches do not apply to $TAG"
            exit 1
          fi
          sed -n 's/^tree: /tree=/p' "$RUNNER_TEMP/prepare.log" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        id: install
        working-directory: upstream
        run: node scripts/npm-retry.mjs ci

      - name: Build test dependencies
        id: deps
        working-directory: upstream
        run: npm run build:server-deps && npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Run patch tests
        id: tests
        run: |
          set -euo pipefail
          while read -r workspace test_file; do
            case "$workspace" in "" | "#"*) continue ;; esac
            echo "::group::$workspace $test_file"
            (cd "upstream/$workspace" && npx vitest run "$test_file" --bail=1)
            echo "::endgroup::"
          done < fork/.fork/tests.txt

      - name: Record failure stage
        id: failure
        if: failure()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if [ "$PREPARE" = "failure" ]; then
            stage="a patch conflicts with this release"
          elif [ "$TESTS" = "failure" ]; then
            stage="the patch tests failed"
          else
            stage="installing or building the test dependencies failed"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

  # The two sign jobs are the only ones that can read the signing key. The fork-release
  # environment holds it as an environment secret and requires a reviewer to approve every
  # run; one approval covers both. Signing happens inside electron-builder, before it writes
  # the installers and the sha512 in the update manifests, so these jobs rebuild instead of
  # re-signing the build job's output (that would mean regenerating all of it by hand).
  sign-macos:
    needs: [resolve, build]
    if: github.repository == 'Vincent-Leon/paseo'
    runs-on: macos-15
    timeout-minutes: 90
    environment: fork-release
    permissions:
      contents: read
    outputs:
      started: ${{ steps.started.outputs.started }}
    steps:
      # A rejected approval never starts the job, so this tells it apart from a failure.
      - name: Mark job started
        id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Check out fork tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          persist-credentials: false

      - name: Check out upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getpaseo/paseo
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          path: upstream
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Apply fork patches
        env:
          TESTED_TREE: ${{ needs.build.outputs.tree }}
        run: |
          set -euo pipefail
          tree="$(bash fork/.fork/prepare-source.sh upstream | sed -n 's/^tree: //p')"
          if [ -z "$TESTED_TREE" ] || [ "$tree" != "$TESTED_TREE" ]; then
            echo "::error::Patched tree $tree is not the tested tree '$TESTED_TREE'"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: upstream
        run: node scripts/npm-retry.mjs ci

      # The key is imported non-extractable and the secret exists only in this step's
      # environment. Later steps can sign with it but cannot export it.
      - name: Import signing key
        env:
          FORK_SIGNING_P12_BASE64: ${{ secrets.FORK_SIGNING_P12_BASE64 }}
          FORK_SIGN_P12_PASSWORD: ${{ secrets.FORK_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/fork-signing.p12"
          (umask 077 && printf '%s' "$FORK_SIGNING_P12_BASE64" | base64 --decode > "$p12")
          bash fork/.fork/signing-keychain.sh create "$p12" "$RUNNER_TEMP/fork-signing.keychain-db"
          rm -f "$p12"

      - name: Build, sign and verify
        env:
          FORK_SIGN_KEYCHAIN: ${{ runner.temp }}/fork-signing.keychain-db
          FORK_EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          # Launches the signed app against an isolated daemon, proving it starts
          # with the self-signed entitlements.
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          NODE_OPTIONS: --max-old-space-size=4096
        run: bash fork/.fork/build-desktop.sh upstream "$RUNNER_TEMP/release"

      - name: Delete signing keychain
        if: always()
        run: bash fork/.fork/signing-keychain.sh delete "$RUNNER_TEMP/fork-signing.keychain-db"

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-macos
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-macos
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign-windows:
    needs: [resolve, build]
    if: github.repository == 'Vincent-Leon/paseo'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: fork-release
    permissions:
      contents: read
    outputs:
      started: ${{ steps.started.outputs.started }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Mark job started
        id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      # The runner checks out with CRLF by default, which would make `git am` and the tree
      # hash disagree with the tested tree.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false && git config --global core.longpaths true

      - name: Check out fork tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          persist-credentials: false

      - name: Check out upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getpaseo/paseo
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          path: upstream
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Apply fork patches
        env:
          TESTED_TREE: ${{ needs.build.outputs.tree }}
        run: |
          set -euo pipefail
          tree="$(bash fork/.fork/prepare-source.sh upstream | sed -n 's/^tree: //p')"
          if [ -z "$TESTED_TREE" ] || [ "$tree" != "$TESTED_TREE" ]; then
            echo "::error::Patched tree $tree is not the tested tree '$TESTED_TREE'"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: upstream
        run: node scripts/npm-retry.mjs ci

      # Without -Exportable the private key cannot leave the store. The secret exists only in
      # this step's environment; later steps sign through the store by thumbprint.
      - name: Import signing key
        shell: pwsh
        env:
          FORK_SIGNING_P12_BASE64: ${{ secrets.FORK_SIGNING_P12_BASE64 }}
          FORK_SIGN_P12_PASSWORD: ${{ secrets.FORK_SIGNING_P12_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "fork-signing.p12"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:FORK_SIGNING_P12_BASE64))
          $password = ConvertTo-SecureString $env:FORK_SIGN_P12_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          Write-Output "signing identity $($cert.Thumbprint) imported"

      - name: Build, sign and verify
        env:
          FORK_EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          # Launches the packaged app against an isolated daemon, proving it starts.
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          NODE_OPTIONS: --max-old-space-size=8192
        run: bash fork/.fork/build-desktop-windows.sh upstream "$(cygpath -u "$RUNNER_TEMP")/release"

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem Cert:\CurrentUser\My |
            Where-Object Subject -eq "CN=Paseo Fork Signing" |
            Remove-Item -DeleteKey

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-windows
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-windows
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Holds the write token and runs no upstream code: it only uploads the signed files.
  # The tag is created with GITHUB_TOKEN, so it starts no other workflow.
  publish:
    needs: [resolve, build, sign-macos, sign-windows]
    if: github.repository == 'Vincent-Leon/paseo' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-release-*
          merge-multiple: true
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          LATEST: ${{ needs.resolve.outputs.latest }}
          PATCH_LOG: ${{ needs.build.outputs.log }}
        run: |
          set -euo pipefail
          base="Paseo-$VERSION-arm64"
          installer="Paseo-Setup-$VERSION-x64.exe"
          files=(
            "$base.dmg" "$base.dmg.blockmap" "$base.zip" "$base.zip.blockmap" "latest-mac.yml"
            "$installer" "$installer.blockmap" "latest.yml"
          )
          cd release
          for file in "${files[@]}"; do
            [ -f "$file" ] || { echo "::error::Missing $file"; exit 1; }
          done
          if [ "$(find . -type f | wc -l)" -ne "${#files[@]}" ]; then
            echo "::error::Unexpected files in the release artifact"
            find . -type f
            exit 1
          fi
          for manifest in latest-mac.yml latest.yml; do
            grep -qx "version: $VERSION" "$manifest" || { echo "::error::$manifest is not $VERSION"; exit 1; }
          done

          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Patched build of [getpaseo/paseo $TAG](https://github.com/$UPSTREAM_REPOSITORY/releases/tag/$TAG) for macOS arm64 and Windows x64."
            echo
            echo "Self-signed with the fork certificate and not notarized; see .fork/README.md on the default branch."
            echo
            echo '```'
            printf '%s\n' "$PATCH_LOG"
            echo '```'
          } > "$notes"

          # An interrupted publish leaves a draft that the read-only resolve job cannot see.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

          existing=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=true
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "Paseo $TAG (fork patched)" --notes-file "$notes"
          fi

          # uploads.github.com fails on large files often enough to retry each one.
          for file in "${files[@]}"; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Giving up on $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

          if [ "$existing" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" --latest="$LATEST"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest="$LATEST"
          fi
          echo "Published $TAG (latest=$LATEST)"

  # Opens or updates one issue per tag when a run that should publish does not, and
  # closes it once that tag is published. A rejected approval is a decision, not a
  # failure, and reports nothing.
  report:
    needs: [resolve, build, sign-macos, sign-windows, publish]
    if: always() && github.repository == 'Vincent-Leon/paseo' && needs.resolve.outputs.build == 'true' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report to an issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
          SIGN_MACOS_RESULT: ${{ needs.sign-macos.result }}
          SIGN_MACOS_STARTED: ${{ needs.sign-macos.outputs.started }}
          SIGN_WINDOWS_RESULT: ${{ needs.sign-windows.result }}
          SIGN_WINDOWS_STARTED: ${{ needs.sign-windows.outputs.started }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          BUILD_STAGE: ${{ needs.build.outputs.stage }}
          PATCH_LOG: ${{ needs.build.outputs.log }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Patched release blocked: $TAG"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"

          stage=""
          if [ "$BUILD_RESULT" = "failure" ]; then
            stage="${BUILD_STAGE:-the build job failed}"
          elif [ "$SIGN_MACOS_RESULT" = "failure" ] && [ "$SIGN_MACOS_STARTED" = "true" ]; then
            stage="building, signing or verifying the macOS app failed"
          elif [ "$SIGN_WINDOWS_RESULT" = "failure" ] && [ "$SIGN_WINDOWS_STARTED" = "true" ]; then
            stage="building, signing or verifying the Windows app failed"
          elif [ "$PUBLISH_RESULT" = "failure" ]; then
            stage="publishing the release failed"
          fi

          if [ -n "$stage" ]; then
            body="$RUNNER_TEMP/issue.md"
            {
              echo "The fork did not publish a patched build of upstream \`$TAG\`: $stage."
              echo
              echo "Run: $RUN_URL"
              echo
              echo "Patch log:"
              echo
              echo '```'
              printf '%s\n' "${PATCH_LOG:-(no patch log; the job failed before patching)}"
              echo '```'
              echo
              echo "Nothing was published. See \"When a run fails\" in .fork/README.md."
            } > "$body"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            fi
          elif [ "$PUBLISH_RESULT" = "success" ] && [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Published by $RUN_URL"
          fi
